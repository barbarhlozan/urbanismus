<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dědina – Build sprites</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    @font-face { font-family: "Basteleur"; src: url("../../fonts/Basteleur-Moonlight.woff2") format("woff2"); }
    :root { --bg: #000; --main: #bababa; --detail: #5f5f5f; }
    body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--main); font: 14px/1.45 "Basteleur", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    main { max-width: 980px; margin: 0 auto; }
    h1 { font-weight: normal; font-size: 26px; margin: 0 0 4px; }
    p { margin: 0 0 16px; color: color-mix(in srgb, var(--main) 70%, var(--bg)); }
    #out { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 12px; }
    .cell { display: grid; grid-template-columns: 38px 96px; gap: 10px; align-items: end; }
    .cell .name { grid-column: 1 / -1; font-size: 12px; color: color-mix(in srgb, var(--main) 70%, var(--bg)); }
    svg { display: block; overflow: visible; color: var(--main); }
    svg * { vector-effect: non-scaling-stroke; }
    /* as the game draws them (styles.css, .icon.sprite) */
    svg path { stroke-width: 1.1px; }
    svg .h { stroke-width: 0.6px; }
    svg .ink { fill: currentColor; stroke-width: 0.5px; }
    svg .p { fill: var(--bg); stroke: none; }
    .big path { stroke-width: 1.6px; } .big .h { stroke-width: 0.9px; }
  </style>
</head>
<body>
  <main>
    <h1>The Build menu's sprites</h1>
    <p>Every file in <code>icons/sprites/</code>, at the size of a tile and at 96 px. Edit a file, or its
      lines in <code>make.js</code> and run <code>node icons/sprites/make.js</code>, and reload.</p>
    <div id="out"></div>
  </main>
  <script type="module">
    import { applyTheme } from '../../src/theme.js';
    applyTheme();
    const names = await (await fetch('list.json')).json();
    const files = await Promise.all(names.map(async (n) => {
      try { return await (await fetch(`${n}.svg`)).text(); } catch { return ''; }
    }));
    const at = (src, px, cls = '') => src.replace('<svg ', `<svg width="${px}" height="${px}" class="${cls}" `).replace(/<!--[\s\S]*?-->/, '');
    document.getElementById('out').innerHTML = names.map((n, i) => `<div class="cell" title="${files[i].match(/<!-- (.*?) -->/)?.[1] ?? ''}">
      ${at(files[i], 38)}${at(files[i], 96, 'big')}<div class="name">${n}</div></div>`).join('');
  </script>
</body>
</html>
