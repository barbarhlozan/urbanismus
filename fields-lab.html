<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dědina – field crop sketches</title>
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="labs.css">
  <style>
    h1 { font-weight: 500; }
    h2 { font-weight: 500; margin: 28px 0 2px; }
    p { margin: 0 0 8px; color: var(--detail); max-width: 76ch; }
    svg { display: block; position: static; border: 1px solid #8884; margin-bottom: 6px; }
    .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
    /* the pens: plain scheme colours, coloured lines in Countryside (the fills stay paper) */
    .edge { fill: none; stroke: var(--detail); stroke-width: calc(var(--pen-1) * var(--k, 1)); stroke-linecap: round; stroke-linejoin: round; }
    .tuft { fill: none; stroke: var(--detail); stroke-width: calc(var(--pen-1) * var(--k, 1)); stroke-linecap: round; }
    .stalk { fill: none; stroke: var(--main); stroke-width: calc(var(--pen-1) * var(--k, 1)); stroke-linecap: round; }
    .ear { fill: none; stroke: var(--main); stroke-width: calc(var(--pen-2) * var(--k, 1)); stroke-linecap: round; }
    .stubble { fill: none; stroke: var(--detail); stroke-width: calc(var(--pen-1) * var(--k, 1)); stroke-linecap: round; }
    .stook { fill: var(--bg); stroke: var(--main); stroke-width: calc(var(--pen-2) * var(--k, 1)); stroke-linejoin: round; stroke-linecap: round; }
    .ridge { fill: none; stroke: var(--detail); stroke-width: calc(var(--pen-1) * var(--k, 1)); stroke-linecap: round; }
    .leaf { fill: var(--bg); stroke: var(--main); stroke-width: calc(var(--pen-1) * var(--k, 1)); stroke-linejoin: round; }
    .bloom { fill: var(--bg); stroke: var(--main); stroke-width: calc(var(--pen-1) * var(--k, 1)); }
    .tuber { fill: var(--detail); stroke: none; }
    .sack { fill: var(--bg); stroke: var(--main); stroke-width: calc(var(--pen-2) * var(--k, 1)); stroke-linejoin: round; }
    html.tint .edge, html.tint .tuft { stroke: #93a35a; }
    html.tint .stalk { stroke: #c2963a; }
    html.tint .ear { stroke: #a87a26; }
    html.tint .stubble { stroke: #c9ac6a; }
    html.tint .stook { stroke: #9a7028; }
    html.tint .ridge { stroke: #9a7a5c; }
    html.tint .leaf { stroke: #5f7d38; }
    html.tint .bloom { stroke: #8a7aa8; }
    html.tint .tuber { fill: #a88358; }
    html.tint .sack { stroke: #7a6448; }
  </style>
</head>
<body>
  <div id="out"></div>
  <script type="module">
    // Dev page: two crops for a field the player draws out like a fence
    // (a closed loop on the fine grid, sim/pastures.js) – grain (obilí) and
    // potatoes (brambory) – each in summer and at harvest, on the map's
    // isometric ground (Camera.project, tile 32), a walker for scale.
    //   fields-lab.html?scheme=2&zoom=4&small=1.5&seed=3
    import { applyTheme } from './src/theme.js';
    import { mulberry32 } from './src/core/random.js';
    import { walkerSVG } from './src/render/people.js';
    const q = new URLSearchParams(location.search);
    applyTheme(q.has('scheme') ? +q.get('scheme') : 2);
    const Z = +(q.get('zoom') ?? 6), SMALL = +(q.get('small') ?? 1.5), SEED = +(q.get('seed') ?? 1);

    const TILE = 32, C30 = Math.cos(Math.PI / 6), S30 = 0.5, ZS = 0.9;
    const pr = (x, y, z = 0) => [(x - y) * C30 * TILE, (x + y) * S30 * TILE - z * ZS * TILE];
    const r2 = (n) => Math.round(n * 100) / 100;
    const P = ([x, y]) => `${r2(x)} ${r2(y)}`;
    const line = (pts) => `M${pts.map(P).join('L')}`;

    // ---------- the field's outline: a loop on the fine grid (half steps), corners rounded ----------
    const LOOP = [[0, 0], [3, 0], [3, 1], [4.5, 1], [4.5, 3.5], [1.5, 3.5], [1.5, 2.5], [0, 2.5]];
    function roundedLoop(pts, r, n = 5) {
      const out = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[(i - 1 + pts.length) % pts.length], b = pts[i], c = pts[(i + 1) % pts.length];
        const da = Math.hypot(b[0] - a[0], b[1] - a[1]), dc = Math.hypot(c[0] - b[0], c[1] - b[1]);
        const p0 = [b[0] + (a[0] - b[0]) * r / da, b[1] + (a[1] - b[1]) * r / da];
        const p1 = [b[0] + (c[0] - b[0]) * r / dc, b[1] + (c[1] - b[1]) * r / dc];
        for (let k = 0; k <= n; k++) {
          const t = k / n, u = 1 - t;
          out.push([u * u * p0[0] + 2 * u * t * b[0] + t * t * p1[0], u * u * p0[1] + 2 * u * t * b[1] + t * t * p1[1]]);
        }
      }
      return out;
    }
    const OUTLINE = roundedLoop(LOOP, 0.35);
    const inside = (x, y) => {
      let c = false;
      for (let i = 0, j = OUTLINE.length - 1; i < OUTLINE.length; j = i++) {
        const [xi, yi] = OUTLINE[i], [xj, yj] = OUTLINE[j];
        if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
      }
      return c;
    };
    const edgeDist = (x, y) => {
      let best = Infinity;
      for (let i = 0; i < OUTLINE.length; i++) {
        const [ax, ay] = OUTLINE[i], [bx, by] = OUTLINE[(i + 1) % OUTLINE.length];
        const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy)));
        best = Math.min(best, Math.hypot(x - ax - t * dx, y - ay - t * dy));
      }
      return best;
    };
    const inField = (x, y, m) => inside(x, y) && edgeDist(x, y) > m;
    const [X0, X1, Y0, Y1] = [Math.min(...LOOP.map((p) => p[0])), Math.max(...LOOP.map((p) => p[0])), Math.min(...LOOP.map((p) => p[1])), Math.max(...LOOP.map((p) => p[1]))];

    // the edge: a ploughed line and the balk (mez) round it, a tuft of grass here and there
    function edge(rnd) {
      const parts = [['edge', `${line(OUTLINE.map(([x, y]) => pr(x, y)))}Z`]];
      let d = '';
      for (let i = 0; i < OUTLINE.length; i++) {
        const [ax, ay] = OUTLINE[i], [bx, by] = OUTLINE[(i + 1) % OUTLINE.length];
        const len = Math.hypot(bx - ax, by - ay), nx = (by - ay) / len, ny = -(bx - ax) / len; // outward (clockwise loop)
        for (let s = rnd() * 0.2; s < len; s += 0.14 + rnd() * 0.16) {
          if (rnd() < 0.45) continue;
          const t = s / len, o = 0.06 + rnd() * 0.06;
          const [sx, sy] = pr(ax + (bx - ax) * t + nx * o, ay + (by - ay) * t + ny * o);
          const h = 0.8 + rnd() * 0.6;
          d += `M${P([sx - 0.25, sy])}Q${P([sx - 0.3, sy - h * 0.5])} ${P([sx - 0.6, sy - h * 0.75])}M${P([sx, sy])}L${P([sx + 0.15, sy - h])}M${P([sx + 0.25, sy])}Q${P([sx + 0.35, sy - h * 0.45])} ${P([sx + 0.65, sy - h * 0.6])}`;
        }
      }
      parts.push(['tuft', d]);
      return parts;
    }

    // ---------- grain (obilí): drilled rows across, an upright stalk and an ear at each step ----------
    function grain(rnd, { rows = 0.11, step = 0.07, h = 0.05, lean = 0.35, gaps = 0.3 } = {}) {
      let stalks = '', ears = '';
      const spots = [];
      for (let y = Y0 + rows / 2; y < Y1; y += rows)
        for (let x = X0 + rnd() * step; x < X1; x += step * (0.8 + rnd() * 0.4)) {
          const jy = y + (rnd() - 0.5) * rows * 0.25;
          if (rnd() > gaps && inField(x, jy, 0.08)) spots.push([x, jy]);
        }
      spots.sort((a, b) => a[0] + a[1] - b[0] - b[1]);
      for (const [x, y] of spots) {
        const [bx, by] = pr(x, y), tall = h * (0.85 + rnd() * 0.3) * ZS * TILE, w = lean * (0.6 + rnd() * 0.8);
        const top = [bx + w, by - tall];
        stalks += `M${P([bx, by])}Q${P([bx + w * 0.2, by - tall * 0.6])} ${P(top)}`;
        ears += `M${P(top)}L${P([top[0] + w * 0.5 + 0.1, top[1] - 0.6])}`;
      }
      return [['stalk', stalks], ['ear', ears]];
    }

    // at harvest: stubble in the same rows, the sheaves stood up in stooks (panáci) in lines
    function stubble(rnd) {
      let d = '';
      for (let y = Y0 + 0.055; y < Y1; y += 0.11)
        for (let x = X0 + rnd() * 0.08; x < X1; x += 0.07 + rnd() * 0.06) {
          if (!inField(x, y, 0.06) || rnd() < 0.35) continue;
          const [sx, sy] = pr(x, y);
          d += `M${P([sx, sy])}l0.1 -0.4`;
        }
      const parts = [['stubble', d]];
      const stooks = [];
      for (let y = Y0 + 0.35; y < Y1; y += 0.45)
        for (let x = X0 + 0.3 + rnd() * 0.3; x < X1; x += 0.28 + rnd() * 0.14)
          if (inField(x, y + 0.05, 0.15)) stooks.push([x + (rnd() - 0.5) * 0.08, y + (rnd() - 0.5) * 0.1]);
      stooks.sort((a, b) => a[0] + a[1] - b[0] - b[1]);
      for (const [x, y] of stooks) {
        // a stook: sheaves leant together, a cap sheaf bent over the top
        const [sx, sy] = pr(x, y), H = (0.065 + rnd() * 0.012) * ZS * TILE, W = H * 0.42;
        const body = `M${P([sx - W, sy])}L${P([sx - W * 0.25, sy - H * 0.82])}L${P([sx + W * 0.3, sy - H * 0.84])}L${P([sx + W, sy])}Q${P([sx, sy + 0.5])} ${P([sx - W, sy])}Z`;
        let straw = '';
        for (const f of [-0.5, 0, 0.5]) straw += `M${P([sx + f * W * 0.9, sy + 0.2])}L${P([sx + f * W * 0.3, sy - H * 0.75])}`;
        const cap = `M${P([sx - W * 0.7, sy - H * 0.62])}Q${P([sx - W * 0.1, sy - H * 1.12])} ${P([sx + W * 0.75, sy - H * 0.6])}`;
        parts.push(['stook', body], ['stalk', straw], ['ear', cap]);
      }
      return parts;
    }

    // ---------- potatoes (brambory): ridges along the field, a leafy clump on each ----------
    const clump = (sx, sy, r, rnd) => {
      // three or four round leaves heaped together, back ones first
      let d = '';
      const n = 3 + (rnd() < 0.5 ? 1 : 0);
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2 + rnd(), cx = sx + Math.cos(a) * r * 0.7, cy = sy - r * 0.9 + Math.sin(a) * r * 0.45 - (k === n - 1 ? r * 0.4 : 0);
        const rr = r * (0.55 + rnd() * 0.2);
        d += `M${r2(cx - rr)} ${r2(cy)}a${r2(rr)} ${r2(rr * 0.8)} 0 1 0 ${r2(2 * rr)} 0a${r2(rr)} ${r2(rr * 0.8)} 0 1 0 ${r2(-2 * rr)} 0`;
      }
      return d;
    };
    function potatoes(rnd, { rows = 0.13, step = 0.08, flowers = true } = {}) {
      const parts = [];
      let ridges = '';
      const plants = [];
      for (let x = X0 + rows / 2; x < X1; x += rows) {
        // a ridge (hrůbek) the length of the field, broken where the field ends
        let run = [];
        const flush = () => { if (run.length > 1) ridges += line(run.map(([a, b]) => pr(a, b))); run = []; };
        for (let y = Y0; y <= Y1; y += 0.05) (inField(x, y, 0.06) ? run.push([x, y]) : flush());
        flush();
        for (let y = Y0 + rnd() * step; y < Y1; y += step * (0.85 + rnd() * 0.3))
          if (inField(x, y, 0.1)) plants.push([x + (rnd() - 0.5) * 0.02, y]);
      }
      parts.push(['ridge', ridges]);
      plants.sort((a, b) => a[0] + a[1] - b[0] - b[1]);
      for (const [x, y] of plants) {
        const [sx, sy] = pr(x, y), r = 0.8 + rnd() * 0.3;
        parts.push(['leaf', clump(sx, sy, r, rnd)]);
        if (flowers && rnd() < 0.18) {
          const fx = sx + (rnd() - 0.5) * r, fy = sy - r * 2.2;
          parts.push(['bloom', `M${r2(fx - 0.25)} ${r2(fy)}a0.25 0.25 0 1 0 0.5 0a0.25 0.25 0 1 0 -0.5 0`]);
        }
      }
      return parts;
    }

    // at harvest: the ridges dug open, potatoes left out on the soil, sacks stood along a row
    function dug(rnd) {
      const parts = [];
      let ridges = '', tubers = '';
      const sacks = [];
      let col = 0;
      for (let x = X0 + 0.065; x < X1; x += 0.13, col++) {
        for (let y = Y0; y < Y1; y += 0.05 + rnd() * 0.08) {
          const y2 = y + 0.06 + rnd() * 0.1;
          if (inField(x, y, 0.06) && inField(x, y2, 0.06) && rnd() < 0.7) ridges += line([pr(x + (rnd() - 0.5) * 0.02, y), pr(x + (rnd() - 0.5) * 0.02, y2)]);
          y = y2;
        }
        for (let y = Y0 + rnd() * 0.1; y < Y1; y += 0.05 + rnd() * 0.1) {
          const tx = x + 0.04 + (rnd() - 0.5) * 0.05;
          if (!inField(tx, y, 0.08) || rnd() < 0.4) continue;
          const [sx, sy] = pr(tx, y), rr = 0.22 + rnd() * 0.12;
          tubers += `M${r2(sx - rr)} ${r2(sy)}a${r2(rr)} ${r2(rr * 0.75)} 0 1 0 ${r2(2 * rr)} 0a${r2(rr)} ${r2(rr * 0.75)} 0 1 0 ${r2(-2 * rr)} 0`;
        }
        if (col % 6 === 3) for (let y = Y0 + 0.4; y < Y1; y += 0.9 + rnd() * 0.4) if (inField(x, y, 0.2)) sacks.push([x + 0.06, y]);
      }
      parts.push(['ridge', ridges], ['tuber', tubers]);
      sacks.sort((a, b) => a[0] + a[1] - b[0] - b[1]);
      for (const [x, y] of sacks) {
        const [sx, sy] = pr(x, y), h = 0.05 * ZS * TILE, w = 0.7;
        parts.push(['sack', `M${P([sx - w, sy])}Q${P([sx - w * 1.15, sy - h * 0.6])} ${P([sx - w * 0.6, sy - h])}L${P([sx + w * 0.6, sy - h])}Q${P([sx + w * 1.15, sy - h * 0.6])} ${P([sx + w, sy])}Q${P([sx, sy + 0.8])} ${P([sx - w, sy])}Z`],
          ['ridge', `M${P([sx - w * 0.5, sy - h * 0.82])}L${P([sx + w * 0.5, sy - h * 0.86])}`]);
      }
      return parts;
    }

    // ---------- the sheet ----------
    const SECTIONS = [
      ['A · Grain (obilí) – summer', (r) => grain(r), 'Stalks scattered loosely along rows across the field, an ear on each, leaning a little with the wind. Ochre lines in Countryside.'],
      ['A · Grain – at harvest', (r) => stubble(r), 'Stubble in the same rows, the sheaves stood up in stooks (panáci) in loose lines, a cap sheaf bent over each.'],
      ['B · Potatoes (brambory) – summer', (r) => potatoes(r), 'Ridges (hrůbky) down the field, the other way to the grain, a heap of round leaves on each, a few pale flowers.'],
      ['B · Potatoes – at harvest', (r) => dug(r), 'The ridges dug open, potatoes left out on the soil to pick, sacks stood along a row.'],
    ];
    const pad = 12;
    const corners = [[X0, Y0], [X1, Y0], [X1, Y1], [X0, Y1]].map(([x, y]) => pr(x, y));
    const vx = Math.min(...corners.map((c) => c[0])) - pad, vy = Math.min(...corners.map((c) => c[1])) - pad - 10;
    const vw = Math.max(...corners.map((c) => c[0])) + pad - vx, vh = Math.max(...corners.map((c) => c[1])) + pad - vy;
    const out = document.getElementById('out');
    out.insertAdjacentHTML('beforeend', `<h1>Field crops</h1><p>A field drawn out as a closed loop on the fine grid (as a fence is), corners rounded, on the map's isometric ground – just the crops, no outline. Each crop in summer and at harvest; a walker by the edge for scale. Shown close (×${Z}), then about the map's size (×${SMALL}). <code>?scheme=0..3</code> for the other pens, <code>?seed=</code> for another draw.</p>`);
    for (const [title, draw, note] of SECTIONS) {
      out.insertAdjacentHTML('beforeend', `<h2>${title}</h2><p>${note}</p>`);
      const rnd = mulberry32(SEED * 7919 + title.length);
      const parts = draw(rnd); // just the crops: no outline, no balk
      const [wx, wy] = pr(X1 + 0.25, Y1 - 0.6);
      const body = parts.map(([c, d]) => `<path class="${c}" d="${d}"/>`).join('') + `<g transform="translate(${r2(wx)} ${r2(wy)})">${walkerSVG(SEED % 12)}</g>`;
      const row = document.createElement('div');
      row.className = 'row';
      for (const z of [Z, SMALL]) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', `${r2(vx)} ${r2(vy)} ${r2(vw)} ${r2(vh)}`);
        svg.style.cssText = `width:${vw * z}px;height:${vh * z}px;--k:${r2(Math.max(0.5, 2.4 / z))}`;
        svg.innerHTML = `<g class="scene">${body}</g>`;
        row.appendChild(svg);
      }
      out.appendChild(row);
    }
  </script>
</body>
</html>
