<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dědina – how a house is built</title>
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { overflow: hidden; height: 100%; position: static; margin: 0; }
    body { background: var(--bg); color: var(--main); font-family: var(--ui-font); display: flex; flex-direction: column; }
    #stage { flex: 1; min-height: 0; position: relative; }
    #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #caption { position: absolute; left: 32px; top: 28px; max-width: 46ch; pointer-events: none; }
    #caption .step { color: var(--detail); font-size: 15px; letter-spacing: 0.04em; }
    #caption h1 { font-weight: normal; font-size: clamp(26px, 4vw, 42px); margin: 2px 0 10px; }
    #caption ol { list-style: none; margin: 0; padding: 0; font: 17px/1.75 ui-monospace, Menlo, monospace; white-space: pre; }
    #caption li { animation: line-in 0.35s both; }
    #caption li .note { color: var(--detail); }
    @keyframes line-in { from { opacity: 0; transform: translateY(4px); } }
    #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 14px 16px 18px; }
    #bar button { font: inherit; font-size: 15px; color: var(--main); background: var(--bg); border: 1.4px solid var(--main); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
    #bar button:hover { background: color-mix(in srgb, var(--main) 10%, var(--bg)); }
    #bar button.on { background: var(--main); color: var(--bg); }
    #bar button:disabled { opacity: 0.35; cursor: default; }
    #bar .sep { width: 1px; height: 24px; background: var(--detail); margin: 0 6px; }
    body.clean #bar { visibility: hidden; }
    .pt { fill: var(--main); }
    .pt-label { fill: color-mix(in srgb, var(--main) 55%, var(--detail)); font-family: ui-monospace, Menlo, monospace; }
    .grid-dot { fill: var(--detail); }
  </style>
</head>
<body>
  <div id="stage">
    <svg id="view" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <g id="grid"></g>
      <g class="scene layer-objects" id="scene"><g id="shadows"></g><g id="solids"></g></g>
      <g id="points"></g>
    </svg>
    <div id="caption"><div class="step"></div><h1></h1><ol></ol></div>
  </div>
  <div id="bar">
    <button id="prev" title="Previous step (←)">◀</button>
    <span id="tabs"></span>
    <button id="next" title="Next step (→)">▶</button>
    <span class="sep"></span>
    <button id="play" title="Play all steps (space)">Play</button>
    <button id="turn" title="Turn the camera (R)">Turn ↻</button>
    <button id="labels" title="Point coordinates (L)">Coordinates</button>
    <button id="colors" title="Colour scheme (C)">Colours</button>
    <button id="clean" title="Hide this bar for recording (H)">Hide bar</button>
  </div>
  <script type="module">
    // Dev page for showing how a building gets drawn: a small village house
    // put together step by step through the real painter
    // (src/render/painter.js) – its points, the walls, the roof, then the
    // windows and doors. Each step is the whole house drawn again; what is
    // new since the step before is sketched in with the pen. Beside it, the
    // numbers behind each step, worked out from the same values the painter uses.
    //   builder.html?step=2&rot=2&scheme=1
    // Keys: ← → steps, space play, R turn, L coordinates, C colours, H hide the bar.
    import { SCHEMES, THEME } from './src/theme.js';
    import { Camera } from './src/render/camera.js';
    import { Painter, LOOK } from './src/render/painter.js';
    import { SUN, sunFor, shadowSVG, tierAt, groundSpacing, wallSpacing } from './src/render/shadows.js';
    import { door, chimney } from './structures/kit.js';

    const q = new URLSearchParams(location.search);
    // colours set here only: theme.js applyTheme() would also change the game's saved scheme
    let scheme = +(q.get('scheme') ?? 0) % SCHEMES.length;
    const colors = () => {
      Object.assign(THEME.palette, SCHEMES[scheme]);
      for (const n of ['bg', 'main', 'detail']) document.documentElement.style.setProperty(`--${n}`, SCHEMES[scheme][n]);
    };
    colors();
    const NS = 'http://www.w3.org/2000/svg';
    const $ = (id) => document.getElementById(id);
    const cam = new Camera({ width: 1, height: 1 }, { tile: 64 });
    cam.rotation = +(q.get('rot') ?? 2);

    // The house: the 'street' house of structures/residential.js, gable to
    // the street (-y), with its door and a window on that side.
    const W = 0.32, D = 0.44, H = 0.19, R = 0.24;
    const X0 = -W / 2, Y0 = -D / 2, X1 = W / 2, Y1 = D / 2;
    const FRONT = [0, -1, 0];
    const rect = (g, cx, y, z, w, h) => g.line([[cx - w / 2, y, z], [cx + w / 2, y, z], [cx + w / 2, y, z + h], [cx - w / 2, y, z + h], [cx - w / 2, y, z]], { facing: FRONT, cls: 'ink' });

    const walls = (g) => g.box(X0, Y0, 0, W, D, H);
    const roof = (g) => g.roofed(X0, Y0, 0, W, D, H, { h: R, ridge: 'y' });
    const openings = (g) => {
      g.windows(X0, Y0, W, D, 0, H, H, 0.1, { h: 0.4, skip: ['front'] });
      door(g, 0.075, Y0, 0.055, 0.11);
      rect(g, -0.07, Y0, H * 0.36, 0.04, H * 0.42);
      rect(g, 0, Y0, H + R * 0.28, 0.034, 0.045);
    };
    const stack = (g) => chimney(g, 0.03, 0.06, H + R * 0.5, R * 0.6);

    // The points: the footprint, lifted to the wall tops, and the ridge.
    const corners = [[X0, Y0], [X1, Y0], [X1, Y1], [X0, Y1]];
    const POINTS = [
      ...corners.map(([x, y]) => ({ at: [x, y, 0] })),
      ...corners.map(([x, y]) => ({ at: [x, y, H] })),
      ...[Y0, Y1].map((y) => ({ at: [0, y, H + R] })),
    ];

    // ----- the numbers -----

    const n2 = (v) => v.toFixed(2);
    const deg = (rad) => `${Math.round((rad * 180) / Math.PI)}°`;
    // as g.windows() works them out (src/render/painter.js)
    const bay0 = 0.1, winH = LOOK.tall ? H * 0.5 : H * 0.4;
    const winW = LOOK.tall ? Math.min(bay0 * 0.55, winH * 0.66) : bay0 * 0.45;
    const bay = LOOK.ink ? bay0 * LOOK.thin : bay0;
    const SIDES = [['front', [0, -1, 0], W], ['right', [1, 0, 0], D], ['back', [0, 1, 0], W], ['left', [-1, 0, 0], D]];

    // [text, note] lines for each step
    const NUMBERS = [
      () => [
        [`w = ${n2(W)}   d = ${n2(D)}`, '  grid cell = 1'],
        [`h = ${n2(H)}   roof = ${n2(R)}`],
        [`x = ±w/2 = ±${n2(W / 2)}`],
        [`y = ±d/2 = ±${n2(D / 2)}`],
        [`z = 0 | ${n2(H)} | ${n2(H)}+${n2(R)} = ${n2(H + R)}`],
        ['4 + 4 + 2 = 10 points'],
      ],
      (g) => [
        ['4 corners → 4 walls'],
        ...SIDES.map(([name, n]) => [`${name.padEnd(6)} ${g.facing(n) ? 'drawn' : 'hidden'}`, g.facing(n) ? '' : '  faces away']),
        [`height ${n2(H)} → ${(H * cam.zScale * cam.tile).toFixed(1)} px`, `  ×${cam.zScale}×${cam.tile}`],
      ],
      () => [
        [`ridge z = ${n2(H)} + ${n2(R)} = ${n2(H + R)}`],
        [`pitch = atan(${n2(R)} / ${n2(W / 2)}) = ${deg(Math.atan(R / (W / 2)))}`],
        [`eaves +${n2(LOOK.eave)} each side`],
        [`hatch every ${n2(LOOK.hatch)}`, `  ≈ ${Math.round((D + 2 * LOOK.eave) / LOOK.hatch)} strokes a slope`],
      ],
      (g) => [
        [`bay = ${n2(bay0)} × ${LOOK.thin} = ${n2(bay)}`],
        ...SIDES.slice(1).map(([name, , len]) => [`${name.padEnd(5)} ⌊${n2(len)} / ${n2(bay)}⌋ = ${Math.floor(len / bay)}`, g.facing(SIDES.find((s) => s[0] === name)[1]) ? '' : '  hidden']),
        [`window ${winW.toFixed(3)} × ${winH.toFixed(3)}`],
        ['front  1 door + 2 windows'],
      ],
    ];

    const STEPS = [
      {
        name: 'Points',
        draw: () => {},
      },
      {
        name: 'Walls',
        draw: (g) => walls(g),
      },
      {
        name: 'Roof',
        draw: (g) => { roof(g); stack(g); },
      },
      {
        name: 'Windows & doors',
        draw: (g) => { roof(g); openings(g); stack(g); },
      },
    ];

    let step = Math.max(0, Math.min(STEPS.length - 1, +(q.get('step') ?? 0)));
    let labels = true, playing = null, shown = [], frame = null;

    // ----- drawing -----

    const painter = () => new Painter(cam, { x: 0, y: 0 }, 0, 1);
    const toScreen = (g, p) => g._project(...g._world(...p));
    const mk = (tag, attrs, parent) => {
      const el = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      parent?.appendChild(el);
      return el;
    };

    // The step's drawing as markup: its shadows and its solids.
    function render(i) {
      const g = painter();
      STEPS[i].draw(g);
      const shade = shadowSVG({ casts: g.casts, feet: g.feet, project: g.groundProjector() }, sunFor(cam));
      return { shadows: shade, solids: g.toSVG() };
    }

    // Frame the finished house (and its points) for this camera turn, so
    // nothing jumps while stepping.
    function frameView() {
      const svg = $('view'), solids = $('solids');
      solids.innerHTML = render(STEPS.length - 1).solids;
      const b = solids.getBBox();
      const g = painter();
      let [x0, y0, x1, y1] = [b.x, b.y, b.x + b.width, b.y + b.height];
      for (const p of POINTS) {
        const [sx, sy] = toScreen(g, p.at);
        x0 = Math.min(x0, sx); y0 = Math.min(y0, sy); x1 = Math.max(x1, sx); y1 = Math.max(y1, sy);
      }
      const box = svg.getBoundingClientRect();
      if (!box.width || !box.height) return; // not laid out yet (hidden tab)
      // room on the left for the caption when the window is wide
      const wide = box.width > 900;
      // narrow: the house goes below the caption (`top`: share of the height it takes)
      const top = wide ? 0 : Math.min(0.5, ($('caption').offsetTop + 110 + 7 * 30) / box.height);
      const h = (y1 - y0) * 1.3 / (1 - top), w = Math.max((x1 - x0) * (wide ? 2.4 : 1.3), h * box.width / box.height);
      const hh = w * box.height / box.width;
      const cx = (x0 + x1) / 2 - (wide ? w * 0.12 : 0), cy = (y0 + y1) / 2 - (top / 2) * hh;
      frame = [cx - w / 2, cy - hh / 2, w, hh];
      svg.setAttribute('viewBox', frame.join(' '));
      const scale = box.width / w;
      svg.style.setProperty('--stroke', (1.5 / scale).toFixed(4));
      svg.style.setProperty('--sun', 1);
      $('scene').setAttribute('class', `scene layer-objects lod-0 sz-${tierAt(scale * cam.tile, groundSpacing())} sw-${tierAt(scale * cam.tile, wallSpacing())}`);
      drawGrid(g, scale);
      solids.innerHTML = '';
      shown = [];
    }

    // The map's grid dots round the house.
    function drawGrid(g, scale) {
      const grid = $('grid');
      grid.innerHTML = '';
      for (let x = -3; x <= 3; x++) for (let y = -3; y <= 3; y++) {
        const [sx, sy] = toScreen(g, [x, y, 0]);
        mk('circle', { cx: sx, cy: sy, r: 2.2 / scale, class: 'grid-dot' }, grid);
      }
    }

    // ----- points -----

    const fmt = (n) => (Math.abs(n) < 1e-9 ? '0' : n.toFixed(2).replace('-', '−').replace(/^(−?)0\./, '$1.'));

    // The points, popping up one after another (animate) or just standing
    // there; `fade`: how strongly they show over the drawing.
    function drawPoints(animate, fade) {
      const layer = $('points'), g = painter();
      layer.innerHTML = '';
      layer.style.transition = 'opacity 0.4s';
      layer.style.opacity = fade;
      const scale = frame && $('view').getBoundingClientRect().width / frame[2];
      if (!fade || !scale) return;
      POINTS.forEach((p, i) => {
        const [sx, sy] = toScreen(g, p.at);
        const dot = mk('circle', { class: 'pt', cx: sx, cy: sy, r: 4 / scale }, layer);
        const label = mk('text', { class: 'pt-label', x: sx + 7 / scale, y: sy - 6 / scale, 'font-size': 13 / scale }, layer);
        label.textContent = p.at.map(fmt).join(', ');
        label.style.display = labels && step === 0 ? '' : 'none';
        if (!animate) return;
        const delay = 300 + i * 160;
        dot.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, delay, fill: 'backwards' });
        label.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: delay + 100, fill: 'backwards' });
      });
    }

    // ----- the pen -----

    // Sketch elements in, one after another (outlines drawn along their
    // length, fills fading in after), as src/render/draw.js does on the map.
    function penIn(els, total = 1300) {
      const items = els.map((el) => {
        let len = 0;
        try { len = el.getTotalLength(); } catch { /* not measurable */ }
        return { el, len: Math.max(len, 1) };
      });
      const sum = items.reduce((s, it) => s + it.len, 0);
      let t = 0;
      for (const { el, len } of items) {
        const dur = Math.max(140, (len / sum) * total * 1.8), delay = (t / sum) * total;
        t += len;
        // windows and doors (ink) just fade in
        if (el.classList.contains('ink')) {
          el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: delay * 0.6, fill: 'backwards' });
          continue;
        }
        const cs = getComputedStyle(el), filled = cs.fill !== 'none';
        el.animate([{ strokeDasharray: `${len} ${len}`, strokeDashoffset: len }, { strokeDasharray: `${len} ${len}`, strokeDashoffset: 0 }],
          { duration: dur, delay, easing: 'ease-in-out', fill: 'backwards' });
        if (filled) el.animate([{ fillOpacity: 0 }, { fillOpacity: 1 }], { duration: 260, delay: delay + dur * 0.8, fill: 'backwards' });
      }
      return total;
    }

    // Show step i: elements already on the paper stay, new ones are drawn
    // in, ones that are gone fade away.
    function show(i, animate = true) {
      step = i;
      const { shadows, solids } = render(i);
      const host = $('solids'), old = new Map();
      shown.forEach((html) => old.set(html, (old.get(html) ?? 0) + 1));
      host.innerHTML = solids;
      const fresh = [];
      for (const el of host.children) {
        const html = el.outerHTML, n = old.get(html) ?? 0;
        if (n) old.set(html, n - 1); else fresh.push(el);
      }
      shown = [...host.children].map((el) => el.outerHTML);
      const sh = $('shadows'), changed = sh.innerHTML !== shadows;
      sh.innerHTML = shadows;
      if (animate && changed) sh.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, delay: 600, fill: 'backwards' });
      if (animate) penIn(fresh);
      drawPoints(animate && i === 0, i === 0 ? 1 : i < 3 ? 0.55 : 0);
      numbers(animate);
      caption();
    }

    // The step's numbers, a line at a time.
    function numbers(animate) {
      const ol = $('caption').querySelector('ol');
      ol.innerHTML = '';
      NUMBERS[step](painter()).forEach(([text, note], k) => {
        const li = document.createElement('li');
        li.textContent = text;
        if (note) li.insertAdjacentHTML('beforeend', `<span class="note"></span>`), (li.lastChild.textContent = note);
        li.style.animationDelay = animate ? `${(step === 0 ? 300 : 150) + k * (step === 0 ? 260 : 180)}ms` : '0s';
        if (!animate) li.style.animation = 'none';
        ol.appendChild(li);
      });
    }

    function caption() {
      const s = STEPS[step], c = $('caption');
      c.querySelector('.step').textContent = `Step ${step + 1} of ${STEPS.length}`;
      c.querySelector('h1').textContent = s.name;
      $('prev').disabled = step === 0;
      $('next').disabled = step === STEPS.length - 1;
      [...$('tabs').children].forEach((b, k) => b.classList.toggle('on', k === step));
      $('labels').classList.toggle('on', labels);
      $('play').textContent = playing ? 'Stop' : 'Play';
    }

    // ----- controls -----

    const go = (i) => { stop(); if (i >= 0 && i < STEPS.length && i !== step) show(i); };
    function stop() { clearTimeout(playing); playing = null; caption(); }
    function play() {
      if (playing) return stop();
      const next = (i) => {
        show(i);
        playing = i < STEPS.length - 1 ? setTimeout(() => next(i + 1), i === 0 ? 2800 : 2600) : null;
        caption();
      };
      // from the start, on a blank sheet
      $('solids').innerHTML = ''; $('shadows').innerHTML = ''; shown = [];
      playing = setTimeout(() => next(0), 400);
      caption();
    }
    function turn() {
      cam.rotation = (cam.rotation + 1) % 4;
      frameView();
      show(step, false);
    }

    STEPS.forEach((s, k) => {
      const b = document.createElement('button');
      b.textContent = `${k + 1} ${s.name}`;
      b.onclick = () => go(k);
      $('tabs').append(b, ' ');
    });
    $('prev').onclick = () => go(step - 1);
    $('next').onclick = () => go(step + 1);
    $('play').onclick = play;
    $('turn').onclick = turn;
    $('labels').onclick = () => { labels = !labels; drawPoints(false, step === 0 ? 1 : step < 3 ? 0.55 : 0); caption(); };
    $('colors').onclick = () => { scheme = (scheme + 1) % SCHEMES.length; colors(); };
    $('clean').onclick = () => document.body.classList.toggle('clean');
    addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey) return;
      const k = e.key.toLowerCase();
      if (k === 'arrowright') go(step + 1);
      else if (k === 'arrowleft') go(step - 1);
      else if (k === ' ') { e.preventDefault(); play(); }
      else if (k === 'r') turn();
      else if (k === 'l') $('labels').click();
      else if (k === 'c') $('colors').click();
      else if (k === 'h') $('clean').click();
      else return;
    });
    addEventListener('resize', () => { frameView(); show(step, false); });

    frameView();
    show(step);
  </script>
</body>
</html>
