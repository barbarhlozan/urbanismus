<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dědina – how a house is built</title>
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { overflow: hidden; height: 100%; position: static; margin: 0; }
    body { background: var(--bg); color: var(--main); font-family: var(--ui-font); display: flex; flex-direction: column; }
    #main { flex: 1; min-height: 0; display: flex; }
    #stage { flex: 1; min-width: 0; position: relative; }
    #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #caption { position: absolute; left: 32px; top: 28px; pointer-events: none; }
    #caption .step { color: var(--detail); font-size: 15px; letter-spacing: 0.04em; }
    #caption h1 { font-weight: normal; font-size: clamp(26px, 4vw, 42px); margin: 2px 0 0; }
    #notes { display: none; width: min(420px, 38vw); box-sizing: border-box; padding: 92px 36px 24px 8px; overflow-y: auto; }
    body.notes #notes { display: block; }
    #notes p { font-size: 18px; line-height: 1.5; margin: 0 0 22px; max-width: 34ch; }
    #notes pre { font: 13px/1.6 ui-monospace, Menlo, monospace; margin: 0; padding: 4px 0 4px 14px; border-left: 1.4px solid var(--detail); white-space: pre-wrap; color: var(--main); }
    #notes pre .c { color: var(--detail); }
    #notes .src { color: var(--detail); font-size: 13px; margin: 0 0 6px; }
    #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 14px 16px 18px; }
    #bar button { font: inherit; font-size: 15px; color: var(--main); background: var(--bg); border: 1.4px solid var(--main); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
    #bar button:hover { background: color-mix(in srgb, var(--main) 10%, var(--bg)); }
    #bar button.on { background: var(--main); color: var(--bg); }
    #bar button:disabled { opacity: 0.35; cursor: default; }
    #bar .sep { width: 1px; height: 24px; background: var(--detail); margin: 0 6px; }
    #bar .group { color: var(--detail); font-size: 14px; margin-right: 2px; }
    body.clean #bar { visibility: hidden; }
    @media (max-width: 760px) {
      #main { flex-direction: column; }
      #notes { width: auto; max-height: 40%; padding: 8px 16px; }
    }
    .pt { fill: var(--main); }
    .pt-label { fill: color-mix(in srgb, var(--main) 55%, var(--detail)); font-family: ui-monospace, Menlo, monospace; }
    .grid-dot { fill: var(--detail); }
    #guides * { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    #guides .guide { stroke: var(--main); stroke-width: calc(1.3px * var(--stroke)); }
    #guides .away { stroke: var(--detail); stroke-width: calc(1.2px * var(--stroke)); stroke-dasharray: calc(4px * var(--stroke)) calc(4px * var(--stroke)); }
    #guides .dash { stroke: var(--main); stroke-width: calc(1.2px * var(--stroke)); }
    #guides .faint { stroke: var(--detail); stroke-width: calc(1px * var(--stroke)); stroke-dasharray: calc(3px * var(--stroke)) calc(5px * var(--stroke)); }
    #guides .spot { fill: var(--main); stroke: none; }
    #guides .off { stroke: var(--detail); stroke-width: calc(1.1px * var(--stroke)); }
  </style>
</head>
<body class="notes">
  <div id="main">
    <div id="stage">
      <svg id="view" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <g id="grid"></g>
        <g class="scene layer-objects" id="scene"><g id="ground"></g><g id="shadows"></g><g id="solids"></g></g>
        <g id="guides"></g>
        <g id="points"></g>
      </svg>
      <div id="caption"><div class="step"></div><h1></h1></div>
    </div>
    <div id="notes"><p></p><div class="src"></div><pre></pre></div>
  </div>
  <div id="bar">
    <button id="prev" title="Previous step (←)">◀</button>
    <span id="tabs"></span>
    <button id="next" title="Next step (→)">▶</button>
    <span class="sep"></span>
    <button id="play" title="Play all steps (space)">Play</button>
    <button id="turn" title="Turn the camera (R)">Turn ↻</button>
    <button id="labels" title="Point coordinates (L)">Coordinates</button>
    <button id="notesBtn" title="Explanation and code beside the drawing (N)">Notes</button>
    <button id="colors" title="Colour scheme (C)">Colours</button>
    <button id="clean" title="Hide this bar for recording (H)">Hide bar</button>
  </div>
  <script type="module">
    // Dev page for showing how things get drawn, made to be recorded: a
    // small village house put together step by step through the real
    // painter (src/render/painter.js) – its points, how they are joined
    // into walls and which walls get drawn, the roof, the windows and
    // doors, then its yard and how its garden is filled – and a tree, from
    // the point it stands on through the oval and lobes its crown is
    // measured on to the pen line and the shading. Each step is the whole
    // drawing again; what is new since the step before is sketched in with
    // the pen. Beside it (Notes) a few plain words on the step and the code
    // that does it, shortened from the real thing. Points are labelled in
    // hundredths of a grid step, so they come out as whole numbers.
    //   builder.html?scene=1&step=2&rot=2&scheme=1&notes=0
    // Keys: ← → steps, ↑ ↓ house / tree, space play, R turn, L coordinates,
    // N notes, C colours, H hide the bar.
    import { SCHEMES, THEME } from './src/theme.js';
    import { Camera } from './src/render/camera.js';
    import { Painter, LOOK } from './src/render/painter.js';
    import { sunFor, shadowSVG } from './src/render/shadows.js';
    import { mulberry32 } from './src/core/random.js';
    import { pointInPolygon } from './src/core/geom2d.js';
    import { door, chimney, fenceAlong } from './structures/kit.js';
    import { drawCourt } from './structures/courts.js';
    import { drawPlot } from './structures/plots.js';
    import { drawTree } from './features/trees.js';

    const q = new URLSearchParams(location.search);
    // colours set here only: theme.js applyTheme() would also change the game's saved scheme
    let scheme = +(q.get('scheme') ?? 0) % SCHEMES.length;
    const colors = () => {
      Object.assign(THEME.palette, SCHEMES[scheme]);
      for (const n of ['bg', 'main', 'detail']) document.documentElement.style.setProperty(`--${n}`, SCHEMES[scheme][n]);
    };
    colors();
    if (q.get('notes') === '0') document.body.classList.remove('notes');
    const NS = 'http://www.w3.org/2000/svg';
    const $ = (id) => document.getElementById(id);
    const cam = new Camera({ width: 1, height: 1 }, { tile: 64 });
    cam.rotation = +(q.get('rot') ?? 2);

    // ----- the house -----

    // The 'street' house of structures/residential.js, gable to the street
    // (-y), with its door and a window on that side.
    const W = 0.32, D = 0.44, H = 0.19, R = 0.24;
    const X0 = -W / 2, Y0 = -D / 2, X1 = W / 2, Y1 = D / 2;
    const FRONT = [0, -1, 0];
    const rect = (g, cx, y, z, w, h) => g.line([[cx - w / 2, y, z], [cx + w / 2, y, z], [cx + w / 2, y, z + h], [cx - w / 2, y, z + h], [cx - w / 2, y, z]], { facing: FRONT, cls: 'ink' });

    const walls = (g) => g.box(X0, Y0, 0, W, D, H);
    const roof = (g) => g.roofed(X0, Y0, 0, W, D, H, { h: R, ridge: 'y' });
    const openings = (g) => {
      g.windows(X0, Y0, W, D, 0, H, H, 0.1, { h: 0.4, skip: ['front'] });
      door(g, 0.075, Y0, 0.055, 0.11);
      rect(g, -0.07, Y0, H * 0.36, 0.04, H * 0.42);
      rect(g, 0, Y0, H + R * 0.28, 0.034, 0.045);
    };
    // The walls as the roof will have them, the roof itself left off: the
    // two short walls carried on up to the ridge (Painter.roofed draws the
    // walls first, then the roof as a solid of its own – kept off here).
    const gabled = (g) => {
      const n = g.solids.length, face = g.face;
      // (and outlined all round: in the game the roof draws their top edges)
      g.face = function (pts, o = {}) { return this.solids.length > n + 1 ? this : face.call(this, pts, { ...o, open: undefined }); };
      roof(g);
      g.face = face;
      g.solids.length = n + 1;
    };
    // the roof's slopes as faces only, before their hatching
    const bareRoof = (g) => g.roofed(X0, Y0, 0, W, D, H, { h: R, ridge: 'y', hatch: false });
    const stack = (g) => chimney(g, 0.03, 0.06, H + R * 0.5, R * 0.6);
    const house = (g) => { roof(g); openings(g); stack(g); };

    // Its yard, as the game draws a house standing on its own: the walled
    // court beside it (structures/courts.js), a fence round the garden
    // behind and along the street.
    const COURT = { left: null, right: 'own' }, BODY = { x0: X0, y0: Y0, x1: X1, y1: Y1 };
    const CELL = [-0.5, -0.5, 0.5, 0.5]; // the plot: halfway to the next dots
    const yard = (g) => {
      drawCourt(g, COURT, BODY);
      fenceAlong(g, [[0.44, Y1], [0.48, 0.48], [-0.48, 0.48], [-0.48, -0.42], [-0.04, -0.42]]);
    };
    const courtArea = drawCourt(new Painter(cam, { x: 0, y: 0 }, 0, 1), COURT, BODY);

    // The garden, filled by the game's own drawPlot (structures/plots.js)
    // with a house's plot settings (residential.js). Its spots are worked
    // out here the same way, from the same seed, to show them first.
    const GARDEN = +(q.get('garden') ?? 125); // (a seed whose garden has a few things in it)
    const onBuilding = (x, y, r) => x > X0 - r - 0.03 && x < X1 + r + 0.03 && y > Y0 - r - 0.03 && y < Y1 + r + 0.03;
    const plot = {
      style: 'garden', density: 0.4, cell: CELL, sides: [],
      // in the plot, off the house, out of the court and the front yard
      inside: (x, y, r) => x - r > CELL[0] && x + r < CELL[2] && y - r > CELL[1] && y + r < CELL[3]
        && y > Y0 && !onBuilding(x, y, r) && !courtArea.some((o) => pointInPolygon([x, y], o)),
    };
    const SPOTS = (() => {
      const rnd = mulberry32(GARDEN), range = (a, b) => a + rnd() * (b - a);
      const out = [], step = 0.14;
      for (let y = CELL[1] + step / 2; y < CELL[3]; y += step) {
        for (let x = CELL[0] + step / 2; x < CELL[2]; x += step) out.push([x + range(-0.03, 0.03), y + range(-0.03, 0.03)]);
      }
      return out;
    })();
    const garden = (g) => { g.random = mulberry32(GARDEN); drawPlot(g, plot); };

    // The points: the footprint, lifted to the wall tops, and the ridge.
    const corners = [[X0, Y0], [X1, Y0], [X1, Y1], [X0, Y1]];
    const HOUSE_POINTS = [
      ...corners.map(([x, y]) => [x, y, 0]),
      ...corners.map(([x, y]) => [x, y, H]),
      ...[Y0, Y1].map((y) => [0, y, H + R]),
    ];

    // ----- guides: what the builder draws over the painter's drawing -----

    // [{ line: [[sx, sy]…] | dot: [sx, sy] | cross: [sx, sy], cls }]
    const S = (g, p) => toScreen(g, p);
    const edges = (g, cls = 'guide') => [
      ...corners.map((c, i) => ({ line: [[...c, 0], [...corners[(i + 1) % 4], 0]].map((p) => S(g, p)), cls })),
      ...corners.map((c) => ({ line: [[...c, 0], [...c, H]].map((p) => S(g, p)), cls })),
      ...corners.map((c, i) => ({ line: [[...c, H], [...corners[(i + 1) % 4], H]].map((p) => S(g, p)), cls })),
    ];
    // an arrow out of each wall (its normal): drawn on if the wall faces us
    // `n` out of a face from its middle `m`, drawn on if the face is
    // turned to us, dashed if it is turned away
    const arrow = (g, m, n, len = 0.14) => {
      const l = Math.hypot(...n), u = n.map((k) => k / l), tip = m.map((k, i) => k + u[i] * len);
      const [s0, s1] = [S(g, m), S(g, tip)], d = [s1[0] - s0[0], s1[1] - s0[1]], dl = Math.hypot(...d), k = 7 / dl;
      const head = [[s1[0] - d[0] * k + d[1] * k * 0.6, s1[1] - d[1] * k - d[0] * k * 0.6], s1, [s1[0] - d[0] * k - d[1] * k * 0.6, s1[1] - d[1] * k + d[0] * k * 0.6]];
      const cls = g.facing(u) ? 'guide' : 'away';
      return [{ line: [s0, s1], cls }, { line: head, cls }];
    };
    const normals = (g) => corners.flatMap((a, i) => {
      const b = corners[(i + 1) % 4];
      return arrow(g, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, H / 2], [b[1] - a[1], a[0] - b[0], 0]);
    });
    // the roof's two slopes: out sideways and up, square to the slope
    const slopes = (g) => [-1, 1].flatMap((s) => arrow(g, [s * W / 4, 0, H + R / 2], [s * R, 0, W / 2], 0.16));
    // Where the windows will go, worked out as g.windows() does
    // (src/render/painter.js) for this house: each wall but the front cut
    // into bays, as many as fit; a window in the middle of each, unless
    // that brings one within LOOK.clear of a corner – then spread evenly
    // between those margins. The front's door and windows are set by hand.
    const BAY = 0.1 * LOOK.thin, WIN_W = 0.1 * 0.45, WIN_H = H * 0.4, WIN_Z = (H - WIN_H) * 0.55;
    const SIDES = [[[X1, Y0], [X1, Y1], [1, 0, 0]], [[X1, Y1], [X0, Y1], [0, 1, 0]], [[X0, Y1], [X0, Y0], [-1, 0, 0]]];
    const bays = (len) => {
      let cols = Math.floor(len / BAY);
      const pad = (len - cols * BAY) / 2, clear = Math.min(LOOK.clear, (len - WIN_W) / 2);
      const cuts = Array.from({ length: cols + 1 }, (_, c) => pad + c * BAY);
      let place = (c) => pad + c * BAY + (BAY - WIN_W) / 2;
      if (place(0) < clear) {
        while (cols > 1 && (len - 2 * clear - cols * WIN_W) / (cols - 1) < WIN_W * 0.8) cols--;
        const st = cols > 1 ? (len - 2 * clear - WIN_W) / (cols - 1) : 0;
        place = (c) => (cols > 1 ? clear + c * st : (len - WIN_W) / 2);
      }
      return { cuts, clear, at: Array.from({ length: cols }, (_, c) => place(c)) };
    };
    // a rectangle on a wall from a to b: t0..t1 along it, z0..z1 up
    const onWall = (g, a, b, t0, t1, z0, z1) => {
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]), p = (t, z) => S(g, [a[0] + ((b[0] - a[0]) * t) / len, a[1] + ((b[1] - a[1]) * t) / len, z]);
      return [p(t0, z0), p(t1, z0), p(t1, z1), p(t0, z1), p(t0, z0)];
    };
    const layout = (g) => {
      const out = [];
      for (const [a, b, n] of SIDES) {
        if (!g.facing(n)) continue;
        const len = Math.hypot(b[0] - a[0], b[1] - a[1]), { cuts, clear, at } = bays(len);
        // the bays: lines up the wall where one ends and the next begins
        for (const t of cuts) out.push({ line: onWall(g, a, b, t, t, 0, H).slice(0, 3).filter((_, i) => i !== 1), cls: 'faint' });
        // the margins kept clear at both corners
        for (const [t0, t1] of [[0, clear], [len - clear, len]]) out.push({ line: onWall(g, a, b, t0, t1, H * 0.12, H * 0.12).slice(0, 2), cls: 'guide' });
        for (const t of at) out.push({ line: onWall(g, a, b, t, t + WIN_W, WIN_Z, WIN_Z + WIN_H), cls: 'dash' });
      }
      // the street front, by hand: the door, a window, one up in the gable
      const F = [[X0, Y0], [X1, Y0]], f = (cx, w, z0, z1) => onWall(g, ...F, cx - X0 - w / 2, cx - X0 + w / 2, z0, z1);
      if (g.facing(FRONT)) out.push(...[f(0.075, 0.055, 0, 0.11), f(-0.07, 0.04, H * 0.36, H * 0.78), f(0, 0.034, H + R * 0.28, H + R * 0.28 + 0.045)].map((line) => ({ line, cls: 'dash' })));
      return out;
    };

    // from the tops of the short walls up to the ridge points
    const rises = (g) => [Y0, Y1].flatMap((y) => [X0, X1].map((x) => ({ line: [S(g, [x, y, H]), S(g, [0, y, H + R])], cls: 'dash' })));
    const square = (g, cls = 'faint') => [{ line: [[CELL[0], CELL[1]], [CELL[2], CELL[1]], [CELL[2], CELL[3]], [CELL[0], CELL[3]], [CELL[0], CELL[1]]].map(([x, y]) => S(g, [x, y, 0])), cls }];
    const spots = (g, faint) => SPOTS.map(([x, y]) => plot.inside(x, y, 0.03)
      ? { dot: S(g, [x, y, 0]), cls: 'spot', r: faint ? 1.6 : 2.6 }
      : faint ? null : { cross: S(g, [x, y, 0]), cls: 'off' }).filter(Boolean);

    // ----- the tree -----

    // One broadleaf (features/trees.js), drawn whole each step and shown
    // part by part, by the classes its lines carry. drawTree tells
    // g.trace how its crown was measured out (loopCrown).
    const TH = 0.9;
    let crownTrace = null;
    const oak = (g) => {
      g.random = mulberry32(5);
      g.trace = (t) => { crownTrace = t; };
      drawTree(g, 0, 0, 'spreading', TH);
    };
    const TREE_POINTS = [[0, 0, 0], [0, 0, TH]];
    const glyph = (g, pts) => {
      const [sx, sy, t] = g._anchor(0, 0, 0);
      return pts.map(([u, v]) => [sx + u * t, sy - v * t]);
    };
    const oval = (g, cls) => [{ line: glyph(g, crownTrace.oval), cls }];
    const cuts = (g, cls) => crownTrace.cuts.map((c) => ({ line: glyph(g, [crownTrace.centre, c]), cls }));
    const TRUNK = ['tree-foot', 'trunk', 'limb', 'twig'];

    // ----- the notes: what each step does, and the code that does it -----
    // (`code`: shortened from the file named in `src`; // lines are dimmed)

    const NOTES = {
      points: {
        say: 'A house starts as ten points: four corners on the ground, the same four lifted to the top of the walls, and two at the ends of the ridge. One step of the map’s grid is 100.',
        src: 'structures/residential.js',
        code: `const W = 0.32, D = 0.44;   // width, depth
const H = 0.19, R = 0.24;   // walls, roof

// four corners round the middle
[-W/2, -D/2]  [W/2, -D/2]
[ W/2,  D/2]  [-W/2, D/2]
// at z = 0 and z = H,
// the ridge at z = H + R`,
      },
      join: {
        say: 'Next corners are joined. On the ground they make the footprint, each goes straight up to its twin, and the four on top close the wall heads. Every wall is one of these four-sided faces.',
        src: 'src/render/painter.js · _walls',
        code: `for (let i = 0; i < base.length; i++) {
  const [ax, ay] = base[i];
  const [bx, by] = base[(i + 1) % base.length];
  // a wall from corner a to corner b
  this.face([[ax, ay, z0], [bx, by, z0],
             [bx, by, z1], [ax, ay, z1]]);
}`,
      },
      facing: {
        say: 'Each wall gets an arrow pointing out of it. If the arrow points towards us, the wall is drawn; if it points away, the wall is at the back and is skipped. From above you only ever see two walls of a box.',
        src: 'src/render/painter.js · face',
        code: `// the arrow out of the face
const n = newellNormal(points);
// turned away from us: nothing to draw
if (!this._facing(n, points[0])) return this;
this.current.parts.push(this._outline(points));
// hatching on the side away from the sun
this._shade(points, n);`,
      },
      walls: {
        say: 'The two walls that face us are drawn with a slightly unsteady pen, corners a little round, so it looks drawn by hand. The wall turned from the sun is hatched, and the house throws its shadow on the ground.',
        src: 'src/render/painter.js · LOOK',
        code: `// set by hand in house-lab.html
export const LOOK = {
  round: { walls: 1, roofs: 1 }, // corners
  hatch: 0.0225,  // a hatch line every
  sketch: 2.5,    // how much the pen wobbles
  ...
};`,
      },
      gables: {
        say: 'Before the roof goes on, the two short walls at the front and the back are carried on up to the ridge points, into a triangle: the gable. So the front wall is no longer a rectangle but one five-sided face, from the ground right up to the top of the roof. That is why it changes shape here.',
        src: 'src/render/painter.js · roofed, _walls',
        code: `// a gable end: its wall runs on up to the ridge
gables[0] = { peak: H + R };  // front
gables[2] = { peak: H + R };  // back

// _walls: five corners instead of four
this.face([[ax, ay, z0], [bx, by, z0],
           [bx, by, zb], [mx, my, peak], [ax, ay, za]]);`,
      },
      roof: {
        say: 'Now the two slopes are laid from the heads of the long walls up to the ridge, resting on the gables and reaching a little past the walls at the eaves. Each slope is a face like a wall and gets the same arrow, but tilted up, square to the slope. The same check decides: the arrow towards us, the slope is drawn; away, it is skipped. On a steep roof like this one the far slope turns away; a flatter roof would show both.',
        src: 'src/render/painter.js · roofed',
        code: `// a slope: eave corners first, then the ridge
const plane = (pts) => {
  face(pts);  // the arrow, the check, the outline
  ...
};
// the arrow of the left slope, up and outwards
n = [-R, 0, W / 2]
// facing us when it points against the view
facing = dot(n, view) < 0`,
      },
      hatching: {
        say: 'Then each slope is hatched. The arrow is checked once more, so a slope turned away gets no lines. The lines run straight up the slope, square to the eave, one every 2¼ hundredths of a step along it, each stopping a little short of the edges at a slightly different place, as a hand would. Last, the chimney comes up through the roof.',
        src: 'src/render/painter.js · _hatch',
        code: `// turned away: no hatching
if (!this._facing(normal, pts[0])) return;
// e along the eave, s up the slope
const e = unit(sub(pts[1], o));
for (let u = u0; u < u1; u += LOOK.hatch) {
  // a little short of the edges, unevenly
  const lo = w0 + len * (0.03 + 0.06 * jitter);
  const hi = w1 - len * (0.05 + 0.12 * jitter);
  lines.push([back(u, hi), back(u, lo)]);
}`,
      },
      bays: {
        say: 'Windows are not placed one by one. Each wall is cut into bays twelve hundredths wide, as many as fit, and each bay is to get a window in its middle. But no window may come within eight of a corner, where the pen’s lines would run into it; if one would, the windows are spread evenly between those two margins instead, one fewer if they would stand too close. The street front is different: its door and window are placed by hand.',

        code: `let cols = Math.floor(len / spacing); // bays that fit

      },
      openings: {
        say: 'Then each window is drawn where it was placed: a filled rectangle, a little under half the wall high and set a touch below the middle, its corners slightly rounded. A window is drawn only on a wall that faces us, by the same arrow as the wall itself.',

      yard: {

      trunk: {

      oval: {
        say: 'The crown is measured on an oval above the trunk, pushed a little to one side so the tree is lopsided. The pen will go round it from one side of the trunk to the other, leaving the bottom open, and the way round is cut into four to six pieces of uneven size.',

      crown: {

    };

    // Scenes: their steps, the points over them and how strongly each step
    // shows them (`pts`), the guides drawn over it, and for the tree which
    // of its lines a step shows (`only`, classes) and whether it casts its
    // shadow yet.
    const SCENES = [
      {
        name: 'House',
        points: HOUSE_POINTS,
        steps: [
          { name: 'Points', note: 'points', draw: () => {}, pts: 1 },
          { name: 'Joining', note: 'join', draw: () => {}, pts: 0.55, guides: (g) => edges(g, 'dash') },
          { name: 'Facing', note: 'facing', draw: () => {}, pts: 0.3, guides: (g) => [...edges(g, 'dash'), ...normals(g)] },
          { name: 'Walls', note: 'walls', draw: walls, pts: 0.3 },
          { name: 'Gables', note: 'gables', draw: gabled, pts: 0.55, guides: (g) => rises(g) },
          { name: 'Roof', note: 'roof', draw: bareRoof, guides: (g) => slopes(g) },
          { name: 'Hatching', note: 'hatching', draw: (g) => { roof(g); stack(g); } },
          { name: 'Bays', note: 'bays', draw: (g) => { roof(g); stack(g); }, guides: (g) => layout(g) },
          { name: 'Windows & doors', note: 'openings', draw: house, guides: (g) => layout(g).filter((it) => it.cls === 'dash').map((it) => ({ ...it, cls: 'faint' })) },
          { name: 'Yard', note: 'yard', draw: (g) => { house(g); yard(g); }, guides: (g) => square(g) },
          { name: 'Spots', note: 'spots', draw: (g) => { house(g); yard(g); }, guides: (g) => [...square(g), ...spots(g)] },
          { name: 'Garden', note: 'garden', draw: (g) => { house(g); yard(g); garden(g); }, guides: (g) => [...square(g), ...spots(g, true)] },
        ],
      },
      {
        name: 'Tree',
        points: TREE_POINTS,
        steps: [
          { name: 'Point', note: 'tree', draw: oak, only: [], pts: 1 },
          { name: 'Trunk', note: 'trunk', draw: oak, only: TRUNK, shade: false, pts: 0.55 },
          { name: 'Oval', note: 'oval', draw: oak, only: TRUNK, shade: false, guides: (g) => [...oval(g, 'away'), ...cuts(g, 'faint')] },
          { name: 'Lobes', note: 'lobes', draw: oak, only: TRUNK, shade: false, guides: (g) => [...oval(g, 'faint'), ...cuts(g, 'faint'), ...crownTrace.lobes.map((l) => ({ line: glyph(g, l), cls: 'guide' }))] },
          { name: 'Crown', note: 'crown', draw: oak, only: [...TRUNK, 'crown', 'crown-line'] },
          { name: 'Shading', note: 'shading', draw: oak },
        ],
      },
    ];

    let sceneAt = Math.max(0, Math.min(SCENES.length - 1, +(q.get('scene') ?? 0)));
    let scene = SCENES[sceneAt], STEPS = scene.steps;
    let step = Math.max(0, Math.min(STEPS.length - 1, +(q.get('step') ?? 0)));
    let labels = true, playing = null, shown = [], frame = null;

    // ----- drawing -----

    const painter = () => {
      const g = new Painter(cam, { x: 0, y: 0 }, 0, 1);
      g.sunFree = false;
      return g;
    };
    const toScreen = (g, p) => g._project(...g._world(...p));
    const mk = (tag, attrs, parent) => {
      const el = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      parent?.appendChild(el);
      return el;
    };

    // Markup with only the lines carrying one of the classes `only`.
    function keep(markup, only) {
      const box = document.createElementNS(NS, 'g');
      box.innerHTML = markup;
      for (const el of [...box.querySelectorAll('*')].reverse()) {
        if (el.children.length) continue;
        if (!only.some((c) => el.classList.contains(c))) el.remove();
      }
      for (const el of [...box.querySelectorAll('g')].reverse()) if (!el.children.length) el.remove();
      return box.innerHTML;
    }

    // The step's drawing as markup: its ground marks, shadows and solids,
    // and its guides.
    function render(i) {
      const s = STEPS[i], g = painter();
      s.draw(g);
      const shadows = s.shade === false || s.only?.length === 0 ? '' : shadowSVG({ feet: g.feet, casts: g.casts, project: g.groundProjector() }, sunFor(cam));
      const solids = s.only ? keep(g.toSVG(), s.only) : g.toSVG();
      return { ground: s.only ? '' : g.toGroundSVG(), shadows, solids, guides: s.guides?.(g) ?? [] };
    }

    // Frame the finished drawing, its points and every step's guides for
    // this camera turn, so nothing jumps while stepping.
    function frameView() {
      const svg = $('view'), solids = $('solids');
      const last = render(STEPS.length - 1);
      solids.innerHTML = last.ground + last.solids;
      const b = solids.getBBox();
      const g = painter();
      let [x0, y0, x1, y1] = [b.x, b.y, b.x + b.width, b.y + b.height];
      const take = ([sx, sy]) => { x0 = Math.min(x0, sx); y0 = Math.min(y0, sy); x1 = Math.max(x1, sx); y1 = Math.max(y1, sy); };
      for (const p of scene.points) take(toScreen(g, p));
      STEPS.forEach((s, i) => s.guides && render(i).guides.forEach((it) => (it.line ?? [it.dot ?? it.cross]).forEach(take)));
      const box = svg.getBoundingClientRect();
      if (!box.width || !box.height) return; // not laid out yet (hidden tab)
      // room at the top for the caption
      const top = Math.min(0.3, 110 / box.height);
      const h = (y1 - y0) * 1.2 / (1 - top), w = Math.max((x1 - x0) * 1.25, h * box.width / box.height);
      const hh = w * box.height / box.width;
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 - (top / 2) * hh;
      frame = [cx - w / 2, cy - hh / 2, w, hh];
      svg.setAttribute('viewBox', frame.join(' '));
      const scale = box.width / w;
      svg.style.setProperty('--stroke', (1.5 / scale).toFixed(4));
      svg.style.setProperty('--sun', 1);
      $('scene').setAttribute('class', 'scene layer-objects lod-0');
      drawGrid(g, scale);
      for (const id of ['solids', 'ground', 'shadows', 'guides']) $(id).innerHTML = '';
      shown = []; guidesShown = new Map();
    }

    // The map's grid dots round the drawing.
    function drawGrid(g, scale) {
      const grid = $('grid');
      grid.innerHTML = '';
      for (let x = -3; x <= 3; x++) for (let y = -3; y <= 3; y++) {
        const [sx, sy] = toScreen(g, [x, y, 0]);
        mk('circle', { cx: sx, cy: sy, r: 2.2 / scale, class: 'grid-dot' }, grid);
      }
    }

    // ----- points -----

    // A point in hundredths of a grid step, in brackets: (−16, −22, 19).
    const fmt = (p) => `(${p.map((n) => String(Math.round(n * 100) || 0).replace('-', '−')).join(', ')})`;

    // The points, popping up one after another (animate) or just standing
    // there; `fade`: how strongly they show over the drawing.
    function drawPoints(animate, fade) {
      const layer = $('points'), g = painter();
      layer.innerHTML = '';
      layer.style.transition = 'opacity 0.4s';
      layer.style.opacity = fade;
      const scale = frame && $('view').getBoundingClientRect().width / frame[2];
      if (!fade || !scale) return;
      scene.points.forEach((p, i) => {
        const [sx, sy] = toScreen(g, p);
        const dot = mk('circle', { class: 'pt', cx: sx, cy: sy, r: 4 / scale }, layer);
        const label = mk('text', { class: 'pt-label', x: sx + 7 / scale, y: sy - 6 / scale, 'font-size': 13 / scale }, layer);
        label.style.display = labels && step === 0 ? '' : 'none';
        if (!animate) return void (label.textContent = fmt(p));
        // plotted one by one, at uneven intervals, its numbers typed beside it
        const delay = 300 + i * 260 + rand(-60, 90);
        stamp(dot, delay);
        typeOut(label, fmt(p), delay + 120, 22);
      });
    }

    // Typing: text put in a few characters at a time, unevenly, as by
    // someone at a keyboard. A newer step stops what an older one typed.
    let typed = 0;
    function typeOut(el, text, delay = 0, per = 18) {
      const mine = typed;
      el.textContent = '';
      let t = delay;
      for (let i = 1; i <= text.length; i++) {
        t += per * rand(0.3, 1.9) + (text[i - 1] === ' ' && Math.random() < 0.1 ? rand(60, 160) : 0);
        setTimeout(() => { if (typed === mine) el.textContent = text.slice(0, i); }, t);
      }
      setTimeout(() => { if (typed === mine) el.textContent = text; }, t + 1);
      return t;
    }
    const fadeOf = (i) => STEPS[i].pts ?? 0;

    // The step's guides: lines drawn in with the pen, one after another,
    // dashed ones a dash at a time, marks set down as the hand gets to
    // them. Guides the step before had stay just as they were.
    let guidesShown = new Map(); // guide (as JSON) -> its elements
    function drawGuides(items, animate) {
      const layer = $('guides'), scale = frame && $('view').getBoundingClientRect().width / frame[2];
      const old = guidesShown, fresh = [];
      guidesShown = new Map();
      if (!scale) return void (layer.innerHTML = '');
      for (const it of items) {
        const key = JSON.stringify(it), kept = animate && old.get(key);
        if (kept) {
          old.delete(key);
          guidesShown.set(key, kept);
          kept.forEach((el) => layer.appendChild(el));
          continue;
        }
        const els = guide(it, scale, layer);
        guidesShown.set(key, els);
        fresh.push({ it, els });
      }
      for (const els of old.values()) els.forEach((el) => el.remove());
      if (!animate) return;
      const lens = fresh.map(({ it }) => (it.line ? polyLen(it.line) * scale : 6));
      const times = pace(lens, 1800);
      fresh.forEach(({ it, els }, k) => {
        const [delay, dur] = times[k];
        if (it.cls === 'guide' && it.line) drawOn(els[0], Math.max(els[0].getTotalLength(), 1), 200 + delay, dur);
        else els.forEach((el, j) => stamp(el, 200 + delay + (dur * j) / els.length));
      });
    }
    const polyLen = (pts) => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);

    // A guide's elements: a dot, a cross, a line – or a dashed line as
    // separate dashes of uneven length, so it can be drawn a dash at a time.
    function guide(it, scale, layer) {
      if (it.dot) return [mk('circle', { cx: it.dot[0], cy: it.dot[1], r: (it.r ?? 2.4) / scale, class: it.cls }, layer)];
      if (it.cross) {
        const [x, y] = it.cross, k = 2.6 / scale;
        return [mk('path', { d: `M${x - k} ${y - k}L${x + k} ${y + k}M${x + k} ${y - k}L${x - k} ${y + k}`, class: it.cls }, layer)];
      }
      const pts = rough(it.line, scale);
      if (it.cls !== 'dash') return [mk('polyline', { points: pts.map((p) => p.join(',')).join(' '), class: it.cls }, layer)];
      const out = [];
      let on = true, left = rand(3.5, 6.5) / scale, d = '';
      for (let i = 1; i < pts.length; i++) {
        let [ax, ay] = pts[i - 1];
        const [bx, by] = pts[i];
        let l = Math.hypot(bx - ax, by - ay);
        while (l > 1e-9) {
          const t = Math.min(left, l), [ux, uy] = [(bx - ax) / l, (by - ay) / l];
          const [cx, cy] = [ax + ux * t, ay + uy * t];
          if (on) d += `M${ax} ${ay}L${cx} ${cy}`;
          [ax, ay, l, left] = [cx, cy, l - t, left - t];
          if (left <= 1e-9) {
            if (on) { out.push(mk('path', { d, class: 'dash' }, layer)); d = ''; }
            on = !on;
            left = (on ? rand(3.5, 6.5) : rand(3, 5)) / scale;
          }
        }
      }
      if (d) out.push(mk('path', { d, class: 'dash' }, layer));
      return out;
    }

    // A construction line as drawn with a ruler in a hurry: a straight one
    // run on a few pixels past both its ends, every point a pixel or so off.
    function rough(line, scale) {
      const px = 1 / scale, j = () => rand(-0.8, 0.8) * px;
      let pts = line.map(([x, y]) => [x + j(), y + j()]);
      if (line.length === 2) {
        const [[ax, ay], [bx, by]] = pts, l = Math.hypot(bx - ax, by - ay) || 1;
        const [ux, uy] = [(bx - ax) / l, (by - ay) / l], a = rand(2, 9) * px, b = rand(3, 11) * px;
        pts = [[ax - ux * a, ay - uy * a], [bx + ux * b, by + uy * b]];
      }
      return pts;
    }

    // ----- the pen -----

    // A hand's pace, not a machine's: each stroke at its own speed, quick
    // off the mark and slowing into its end, with the pen lifted a moment
    // between strokes and now and then a longer stop to look. Strokes go
    // one after another; `total` (ms) squeezes a long drawing in.
    const rand = (a, b) => a + Math.random() * (b - a);
    const HAND = 'cubic-bezier(0.25, 0.6, 0.55, 1)';
    const pxScale = () => frame ? $('view').getBoundingClientRect().width / frame[2] : 1;
    function pace(lens, total) {
      const raw = lens.map((len) => [(70 + len * 2.4) * rand(0.6, 1.5), Math.random() < 0.08 ? rand(220, 420) : rand(25, 110)]);
      const sum = raw.reduce((s, [d, gap]) => s + d + gap, 0), k = Math.min(1, total / sum);
      let t = 0;
      return raw.map(([d, gap]) => { const at = t; t += (d + gap) * k; return [at, Math.max(40, d * k)]; });
    }
    const drawOn = (el, len, delay, duration) => el.animate(
      [{ strokeDasharray: `${len} ${len}`, strokeDashoffset: len }, { strokeDasharray: `${len} ${len}`, strokeDashoffset: 0 }],
      { duration, delay, easing: HAND, fill: 'backwards' });
    // there at once from `delay` on, as a stamp or a fill put down
    const stamp = (el, delay, prop = 'opacity') => el.animate([{ [prop]: 0 }, { [prop]: 1 }], { duration: 1, delay, fill: 'backwards' });

    // Sketch elements in, one after another: outlines drawn along their
    // length, fills put down once the outline is round, windows and doors
    // (ink) set in as they come.
    function penIn(els, total = 1300) {
      const s = pxScale();
      const items = els.map((el) => {
        let len = 0;
        try { len = el.getTotalLength(); } catch { /* not measurable */ }
        return { el, len: Math.max(len, 1) };
      });
      const times = pace(items.map((it) => it.len * s), total);
      items.forEach(({ el, len }, i) => {
        const [delay, dur] = times[i];
        if (el.classList.contains('ink') || !el.getTotalLength) return stamp(el, delay);
        drawOn(el, len, delay, dur);
        if (getComputedStyle(el).fill !== 'none') stamp(el, delay + dur, 'fillOpacity');
      });
      return total;
    }

    // The leaf elements under `host`, groups opened up, so the pen draws
    // each line of a tree or a prop on its own.
    const leaves = (host) => [...host.querySelectorAll('*')].filter((el) => !el.children.length);

    // Show step i: elements already on the paper stay, new ones are drawn
    // in, ones that are gone fade away.
    function show(i, animate = true) {
      step = i;
      const { ground, shadows, solids, guides } = render(i);
      const host = $('solids'), old = new Map();
      shown.forEach((html) => old.set(html, (old.get(html) ?? 0) + 1));
      host.innerHTML = solids;
      const fresh = [];
      for (const el of leaves(host)) {
        const html = el.outerHTML, n = old.get(html) ?? 0;
        if (n) old.set(html, n - 1); else fresh.push(el);
      }
      shown = leaves(host).map((el) => el.outerHTML);
      const gr = $('ground'), grChanged = gr.innerHTML !== ground;
      gr.innerHTML = ground;
      // (ground marks and shadows come in a couple of jumps, not a fade)
      if (animate && grChanged) gr.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: 300, easing: 'steps(2, end)', fill: 'backwards' });
      const sh = $('shadows'), changed = sh.innerHTML !== shadows;
      sh.innerHTML = shadows;
      if (animate && changed) sh.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: 900, easing: 'steps(3, end)', fill: 'backwards' });
      typed++;
      if (!animate) $('caption').querySelector('h1').textContent = STEPS[i].name; // (in case it was being typed)
      if (animate) penIn(fresh, Math.min(3400, 1400 + fresh.length * 10));
      drawGuides(guides, animate);
      drawPoints(animate && fadeOf(i) === 1, fadeOf(i));
      caption(animate);
      notes(animate);
    }

    // The step's words and code beside the drawing.
    function notes(animate) {
      const n = NOTES[STEPS[step].note], box = $('notes'), mine = typed;
      const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const lines = n.code.split('\n').map((l) => {
        const at = l.indexOf('//');
        return at < 0 ? esc(l) : `${esc(l.slice(0, at))}<span class="c">${esc(l.slice(at))}</span>`;
      });
      const pre = box.querySelector('pre');
      if (!animate) {
        box.querySelector('p').textContent = n.say;
        box.querySelector('.src').textContent = n.src;
        pre.innerHTML = lines.join('\n');
        return;
      }
      // the words typed, then the file named, then the code a line at a time
      let t = typeOut(box.querySelector('p'), n.say, 250, 14);
      t = typeOut(box.querySelector('.src'), n.src, t + 200, 10);
      pre.innerHTML = '';
      lines.forEach((_, k) => {
        t += rand(60, 200) + (lines[k].trim() ? 0 : 120);
        setTimeout(() => { if (typed === mine) pre.innerHTML = lines.slice(0, k + 1).join('\n'); }, t);
      });
    }

    function caption(animate = false) {
      const s = STEPS[step], c = $('caption'), h1 = c.querySelector('h1');
      c.querySelector('.step').textContent = `${scene.name} · ${step + 1} / ${STEPS.length}`;
      if (h1.dataset.name !== s.name) {
        h1.dataset.name = s.name;
        if (animate) typeOut(h1, s.name, 0, 45);
        else h1.textContent = s.name;
      }
      $('prev').disabled = step === 0;
      $('next').disabled = step === STEPS.length - 1;
      $('tabs').querySelectorAll('button').forEach((b) => b.classList.toggle('on', +b.dataset.scene === sceneAt && +b.dataset.step === step));
      $('labels').classList.toggle('on', labels);
      $('notesBtn').classList.toggle('on', document.body.classList.contains('notes'));
      $('play').textContent = playing ? 'Stop' : 'Play';
    }

    // ----- controls -----

    function pick(k, i = 0) {
      stop();
      if (k !== sceneAt) {
        sceneAt = k; scene = SCENES[k]; STEPS = scene.steps; step = i;
        frameView();
        show(i);
      } else if (i >= 0 && i < STEPS.length && i !== step) show(i);
    }
    const go = (i) => pick(sceneAt, i);
    function stop() { clearTimeout(playing); playing = null; caption(); }
    function play() {
      if (playing) return stop();
      const next = (i) => {
        show(i);
        // (longer with the notes up, to read them)
        const wait = document.body.classList.contains('notes') ? 6000 : i === 0 ? 2800 : 2600;
        playing = i < STEPS.length - 1 ? setTimeout(() => next(i + 1), wait) : null;
        caption();
      };
      // from the start, on a blank sheet
      for (const id of ['solids', 'ground', 'shadows', 'guides']) $(id).innerHTML = '';
      shown = []; guidesShown = new Map();
      playing = setTimeout(() => next(0), 400);
      caption();
    }
    function turn() {
      cam.rotation = (cam.rotation + 1) % 4;
      frameView();
      show(step, false);
    }
    function reframe() { frameView(); show(step, false); }

    SCENES.forEach((sc, k) => {
      if (k) $('tabs').append(Object.assign(document.createElement('span'), { className: 'sep' }), ' ');
      $('tabs').append(Object.assign(document.createElement('span'), { className: 'group', textContent: sc.name }), ' ');
      sc.steps.forEach((s, i) => {
        const b = document.createElement('button');
        b.textContent = s.name;
        b.dataset.scene = k;
        b.dataset.step = i;
        b.onclick = () => pick(k, i);
        $('tabs').append(b, ' ');
      });
    });
    $('prev').onclick = () => go(step - 1);
    $('next').onclick = () => go(step + 1);
    $('play').onclick = play;
    $('turn').onclick = turn;
    $('labels').onclick = () => { labels = !labels; drawPoints(false, fadeOf(step)); caption(); };
    $('notesBtn').onclick = () => { document.body.classList.toggle('notes'); reframe(); };
    $('colors').onclick = () => { scheme = (scheme + 1) % SCHEMES.length; colors(); };
    $('clean').onclick = () => document.body.classList.toggle('clean');
    addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey) return;
      const k = e.key.toLowerCase();
      if (k === 'arrowright') go(step + 1);
      else if (k === 'arrowleft') go(step - 1);
      else if (k === 'arrowdown' || k === 'arrowup') { e.preventDefault(); pick((sceneAt + (k === 'arrowdown' ? 1 : SCENES.length - 1)) % SCENES.length); }
      else if (k === ' ') { e.preventDefault(); play(); }
      else if (k === 'r') turn();
      else if (k === 'l') $('labels').click();
      else if (k === 'n') $('notesBtn').click();
      else if (k === 'c') $('colors').click();
      else if (k === 'h') $('clean').click();
      else return;
    });
    addEventListener('resize', reframe);

    frameView();
    show(step);
  </script>
</body>
</html>
